# app properties
application.upload=upload-dir
application.images=data/images

# config for generation of Thymeleaf templates
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

# config for h2 database
spring.datasource.url=jdbc:h2:mem:coursedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
#config for neo4j database
# test config
spring.neo4j.authentication.password=mdtea-test
spring.neo4j.authentication.username=neo4j
spring.neo4j.uri=bolt://localhost:7687
spring.jpa.open-in-view=true
# must be set to neo4j to if community edition is used
spring.data.neo4j.database=neo4j
#localization
spring.messages.basename=messages
spring.messages.cache-duration=-1
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=true
spring.web.locale=de
# disable warning of neo4j deprecated function
#logging.level.org.springframework.data.neo4j=ERROR
