<!DOCTYPE html>
<html lang="en" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org"
>
<head>
    <meta charset="UTF-8">
    <title layout:title-pattern="$CONTENT_TITLE - $LAYOUT_TITLE">MDTea</title>
    <th:block th:replace="~{main::head-tag}"></th:block>
</head>
<body>

<nav layout:fragment="navigation" th:replace="~{main::navigation}"></nav>
<header layout:fragment="header"></header>
<div layout:fragment="messages" th:replace="~{main::message-and-error}"></div>

<main class="flex-grow-1 container" layout:fragment="content">

</main>

<footer layout:fragment="footer" th:replace="~{main :: footer}"></footer>
<div layout:fragment="scripts">

</div>
</body>
</html>
